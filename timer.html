<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Timey Bear Study Timer - Your active study session.">
    
    <title>Timey Bear: Study Session</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <!-- Background -->
    <div class="background-image">
        <img src="images/pink_background.png" alt="Pink background">
    </div>

    <!-- Bear Animation -->
    <div class="bear" aria-hidden="true">
        <img src="images/bear_reading.gif" alt="Timey the study bear reading">
    </div>

    <!-- Study Plan Display -->
    <div class="notepad-wrapper">
        <div class="notepad" aria-hidden="true">
            <img src="images/notepad.png" alt="">
            <span id="plan" class="plan" role="region" aria-label="Your study plan"></span>
        </div>
    </div>

    <!-- Book Cover Animation -->
    <div class="book_cover" aria-hidden="true">
        <img src="images/yellow_book.png" alt="Yellow book cover">
    </div>

    <!-- Book Page Turn Animation -->
    <div class="book_gif" aria-hidden="true">
        <img src="images/book_turning.gif" alt="Book pages turning">
    </div>

    <!-- Back Button -->
    <button 
        class="back" 
        id="back" 
        aria-label="Exit study session"
        title="Press to quit (Q to confirm, C to cancel)">
        <img src="images/y_x.png" alt="Exit">
    </button>

    <!-- Timer Container -->
    <div class="timer_box" id="timer_box" role="region" aria-label="Study timer">
        <div class="base-timer">
            <!-- Circular Progress Display -->
            <svg 
                class="base-timer__svg" 
                viewBox="0 0 100 100" 
                xmlns="http://www.w3.org/2000/svg"
                role="img"
                aria-label="Timer progress circle">
                <g class="base-timer__circle">
                    <circle class="base-timer__path-elapsed" cx="50" cy="50" r="45" />
                    <path
                        id="base-timer-path-remaining"
                        stroke-dasharray="283"
                        class="base-timer__path-remaining"
                        d="
                            M 50, 50
                            m -45, 0
                            a 45,45 0 1,0 90,0
                            a 45,45 0 1,0 -90,0
                        "
                        aria-hidden="true"
                    ></path>
                </g>
            </svg>
            
            <!-- Time Display -->
            <span 
                id="base-timer-label" 
                class="base-timer__label"
                role="status"
                aria-live="polite"
                aria-label="Time remaining">
                00:00
            </span>
        </div>

        <!-- Play Button -->
        <button 
            id="play_button" 
            class="control-button"
            aria-label="Start or resume study session"
            title="Click to start">
            <img src="images/y_play.png" alt="">
        </button>

        <!-- Pause Button -->
        <button 
            id="pause_button" 
            class="control-button"
            aria-label="Pause study session"
            title="Click to pause">
            <img src="images/y_pause.png" alt="">
        </button>

        <!-- Confirmation Modal -->
        <div id="modalSure" class="modalSure" role="alertdialog" aria-labelledby="modal-title">
            <div class="modalSure-content">
                <p id="modal-title" style="font-weight: 900; color: #894343;">
                    Are you sure you want to end your study session?
                </p>
                <p style="margin-top: 15px; font-size: 0.95rem;">
                    All progress will be lost.
                </p>
                <p style="margin-top: 15px; font-size: 0.9rem; color: #999;">
                    Press <kbd>Q</kbd> to quit or <kbd>C</kbd> to continue studying
                </p>
            </div>
        </div>
    </div>

    <!-- Audio -->
    <audio id="ding" src="images/sound.mp3" preload="auto"></audio>

    <!-- Scripts (Using refactored timer.js) -->
    <script src="timer.js"></script>
</body>

</html>
