<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Timey: A cute study timer with conversational setup and Pomodoro technique.">
    
    <title>Timey Bear: Let's Study!</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="./style-v2.css">
</head>

<body>
    <!-- Background -->
    <div class="background-image">
        <img src="images/pink_background.png" alt="Pink background">
    </div>

    <!-- Main Container -->
    <div class="conversational-container">
        
        <!-- Left: Speech Bubble Area -->
        <div class="conversation-area">
            <div class="speech-bubble" id="speechBubble">
                <img src="images/speech-bubble.png" alt="">
                <div class="bubble-text" id="bubbleText">
                    Hello! I'm Timey.
                </div>
            </div>
        </div>

        <!-- Right: Bear & Controls -->
        <div class="bear-area">
            <div class="bear-container">
                <img src="images/timey-bear.png" alt="Timey the study bear" class="bear-image">
            </div>
        </div>
    </div>

    <!-- Controls Area (Below) -->
    <div class="controls-area" id="controlsArea">
        <button class="button button-primary" id="primaryBtn">Next</button>
        <button class="button button-secondary" id="secondaryBtn" style="display: none;">Back</button>
    </div>

    <!-- Input Area (Hidden by default) -->
    <div class="input-area" id="inputArea" style="display: none;">
        <input 
            type="text" 
            class="input-field" 
            id="userInput" 
            placeholder="Enter value"
            aria-label="User input">
    </div>

    <!-- Scripts -->
    <script src="conversational.js"></script>
</body>

</html>
