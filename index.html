<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timey Bear: Let's Study!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="background-image">
        <img src="images/pink_background.png" alt="">
    </div>

    <div class="conversational-container">
        <div class="conversation-area">
            <div class="speech-bubble" id="speechBubble">
                <img src="images/speech-bubble.png" alt="">
                <div class="bubble-text" id="bubbleText">Hello! I'm Timey.</div>
            </div>
        </div>
        <div class="bear-area">
            <div class="bear-container">
                <img src="images/timey-bear.png" alt="Timey the study bear" class="bear-image">
            </div>
        </div>
    </div>

    <div class="input-area" id="inputArea" style="display: none;"></div>

    <div class="controls-area" id="controlsArea"></div>

    <script src="conversational.js"></script>
</body>
</html>
