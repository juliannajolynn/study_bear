<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Great Work! Session Complete</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="background-image">
        <img src="images/pink_background.png" alt="">
    </div>
    <div class="results-container">
        <div class="celebration">
            <img src="images/timey-bear.png" alt="Timey celebrating" style="width: 180px; height: auto;">
        </div>
        <h1 class="results-title">Great Work!</h1>
        <p style="font-size: clamp(1rem, 3vw, 1.2rem); color: #894343; margin-bottom: 25px;">
            You completed your study session!
        </p>
        <div class="stats-box">
            <div class="stat-item">
                <div class="stat-label">Total Study Time</div>
                <div class="stat-value" id="total-study-time">--</div>
                <div style="font-size: 0.85rem; color: #AB6666;">minutes</div>
            </div>
            <div class="stat-item" style="margin-top: 25px; padding-top: 18px; border-top: 2px solid rgba(218,162,162,0.3);">
                <div class="stat-label">Today's Sessions</div>
                <div class="stat-value" id="daily-sessions">--</div>
            </div>
        </div>
        <p style="font-size: 1rem; color: #7c5350; margin-top: 25px; font-style: italic;" id="motivational-message">
            You're doing amazing! Keep up the good work!
        </p>
        <div class="action-buttons">
            <button class="button button-primary" onclick="window.location.href='index.html'">Start Another Session</button>
            <button class="button button-secondary" onclick="window.location.href='index.html'">Back to Home</button>
        </div>
    </div>
    <script src="results.js"></script>
</body>
</html>
